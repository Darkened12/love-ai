services:
  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./DjangoBackend/media:/app/media:ro
    depends_on:
      - gateway
      - django-backend
      - llm

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  llm:
    build: ./LLM
    environment:
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./LLM:/app
      - llm_databases:/app/.databases
    depends_on:
      - db

  django-backend:
    build: ./DjangoBackend
    expose:
      - "8000"
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./DjangoBackend:/app
      - ./DjangoBackend/media:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      - db

  gateway:
    build: ./Gateway
    expose:
      - "8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./Gateway:/app
    depends_on:
      - django-backend
      - llm

volumes:
  postgres_data:
  static_volume:
  llm_databases: