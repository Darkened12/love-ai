<div class="m-3 row d-flex align-items-center">
    <div class="col">
      <textarea
         [(ngModel)]="message" 
         (keydown.enter)="handleSend($event)"
         class="form-control"
         [disabled]="!chatId() || (isStreaming$ | async) === true"
      ></textarea>
    </div>
    <div class="col-auto">
      <button
        (click)="handleSend($event)"
        class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
        style="width: 40px; height: 40px;"
        [disabled]="!chatId() || (isStreaming$ | async)"
      >
      <img src="/images/send.png" width="20" height="20" />
      </button>
  </div>
</div>
