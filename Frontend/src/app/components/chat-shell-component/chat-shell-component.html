<div class="d-flex flex-column vh-100">
    <!-- NAVBAR -->
    <div class="p-2 border-bottom bg-white">
        <app-navbar-component></app-navbar-component>
    </div>

    <!-- OFFCANVAS -->
    <app-chat-list-component
     [chatsList]="(chatsList$ | async) ?? []"
     [chatId]="(chatId$ | async) ?? ''"
     (updatedChatsList)="updatedChatsList($event)"
     (renameRequested)="openRenameModal($event)"
     (deleteRequested)="openDeleteModal($event)"
     ></app-chat-list-component>

    <!-- MODAL -->
    <app-chat-delete-modal-component
        [selectedChat]="selectedChat"
        (confirmed)="onChatDelete()"
        #deleteModal>
    </app-chat-delete-modal-component>

    <app-chat-rename-modal-component
        [selectedChat]="selectedChat"
        (confirmed)="onRenameSubmit()"
        #renameModal>
    </app-chat-rename-modal-component>

    <!-- CHAT -->
    <div #scrollContainer
         class="flex-grow-1 overflow-auto p-2"
         (scroll)="onScroll()">
        <app-chat-component 
            [userProfile]="userProfile$ | async"
            [chatsList]="(chatsList$ | async) ?? []"
            [chatId]="chatId$ | async"
            ></app-chat-component>
    </div>
    <!-- INPUT -->
    <div class="d-flex justify-content-center">
        <app-input-component
         class="border bg-white message-input"
         [userProfile]="userProfile$ | async"
         [chatId]="chatId$ | async"
         ></app-input-component>
    </div>

    @if (showScrollButton) {
        <button
            class="btn btn-primary rounded-circle scroll-bottom"
            (click)="scrollToBottom()">
            <i class="bi bi-arrow-down"></i>
        </button>
    }

</div>
